<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>

    

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5eeea;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .instruction {
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            color: #555; /* gris foncé */
        }


        .projet {
            width: 90%;
            max-width: 400px;
            margin: 20px auto; /* centre horizontalement */
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            background-color: #ffffff;
            text-align: center; /* centre le texte */
        }

        .pdfs {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .pdfs a {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #000;
            background-color: #e8cfa7;
            font-weight: bold;
        }


    </style>

<script>
function toggle(id) {
    var element = document.getElementById(id);

    if (element.style.display === "flex") {
        element.style.display = "none";
    } else {
        element.style.display = "flex";
    }
}
</script>
</head>

<body>

<p class="instruction">Cliquez sur une case pour obtenir plus d'information</p>

<div class="container">

    <div class="projet" onclick="toggle('projet1')">
        Planification énergétique sous incertitude ▼
    </div>

    <div id="projet1" class="pdfs">
        <a href="./files/TET4565_project.pdf" target="_blank">Sujet ▶</a>
        <a href="./files/TET4565___Group_14_PM_Optimization.pdf" target="_blank">Compte rendu ▶</a>
    </div>

    <div class="projet" onclick="toggle('projet2')">
        Conception et analyse d’une terminaison de câble haute tension ▼
    </div>

    <div id="projet2" class="pdfs">
        <a href="./files/prosjektbeskrivelse_engelsk.pdf" target="_blank">Sujet ▶</a>
        <a href="./files/HVIM_Project.pdf" target="_blank">Compte rendu ▶</a>
    </div>

</div>

</body>
</html>
